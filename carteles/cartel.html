<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cartel pagos</title>
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=League+Spartan:wght@600;700;800&family=Special+Elite&family=Caveat:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Uso: cartel.html?p=entradas|cocina|merch&f=a4|celu  (a4 = 1240x1754, celu = 1080x1920) */
:root{--amarillo:#ffc000; --crema:#f6dfc0; --texto:#121212; --W:1240px; --H:1754px; --qr:600px; --tit:150px}
body.celu{--W:1080px; --H:1920px; --qr:620px; --tit:140px}
*{box-sizing:border-box;margin:0;padding:0}
body{width:var(--W);height:var(--H);overflow:hidden;background:#5f625b;color:#fff;font-family:Questrial,sans-serif;position:relative}
.fondo{position:absolute;inset:-80px;background:url(../img/fondo.jpg) center/cover;filter:blur(26px) saturate(1.1);z-index:0}
.velo{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.12) 45%,rgba(0,0,0,.35));z-index:1}
.colgante{position:absolute;top:0;left:0;width:100%;height:calc(var(--H) * .27);object-fit:cover;object-position:right top;z-index:2;
  -webkit-mask-image:linear-gradient(to bottom,#000 50%,transparent);mask-image:linear-gradient(to bottom,#000 50%,transparent)}
.cont{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--H) * .19);text-shadow:0 3px 10px rgba(0,0,0,.35)}
h1{font-weight:400;font-size:var(--tit);line-height:1;letter-spacing:2px}
.sub{display:flex;align-items:center;gap:14px;margin-top:6px}
.sub img{width:190px;height:112px;object-fit:cover;-webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent);mask-image:radial-gradient(closest-side,#000 30%,transparent)}
.sub .f{display:block;font-family:"Special Elite",monospace;font-size:62px;color:var(--crema);line-height:1}
.sub .e{display:block;font-family:Caveat,cursive;font-size:44px;line-height:1;margin-top:4px;text-align:center}
.qr{margin-top:40px;background:#fff;border:6px solid #111;padding:28px;width:calc(var(--qr) + 68px);height:calc(var(--qr) + 68px)}
.qr svg{display:block;width:100%;height:100%}
.llamado{margin-top:34px;font-family:"League Spartan",sans-serif;font-weight:800;font-size:58px;color:var(--amarillo);letter-spacing:1px}
.o{margin-top:26px;font-size:38px}
.alias{margin-top:12px;background:var(--amarillo);color:var(--texto);border:5px solid #111;padding:16px 40px 10px;font-family:"League Spartan",sans-serif;font-weight:800;font-size:66px;text-shadow:none}
body.celu .cont{padding-top:calc(var(--H) * .2)}
body.celu .qr{margin-top:60px}
body.celu .llamado{margin-top:44px}
</style>
</head>
<body>
<div class="fondo"></div><div class="velo"></div>
<img class="colgante" src="../img/colgante.jpg" alt="">
<div class="cont">
  <h1 id="tit"></h1>
  <div class="sub">
    <img src="../img/margaritas.jpg" alt="">
    <div><span class="f">festivalazo</span><span class="e">9na edición</span></div>
  </div>
  <div class="qr" id="qr"></div>
  <div class="llamado">ESCANEÁ PARA PAGAR</div>
  <div class="o">o transferí al alias</div>
  <div class="alias" id="alias"></div>
</div>
<script>
const CUENTAS = {
  entradas: { titulo: 'ENTRADAS', alias: 'festivalazo.elorigen' },
  cocina:   { titulo: 'COCINA',   alias: 'festivalazo.cocina' },
  merch:    { titulo: 'MERCH',    alias: 'ropita.festivalazo' },
};
const q = new URLSearchParams(location.search);
const p = CUENTAS[q.get('p')] ? q.get('p') : 'entradas';
if (q.get('f') === 'celu') document.body.classList.add('celu');
document.getElementById('tit').textContent = CUENTAS[p].titulo;
document.getElementById('alias').textContent = CUENTAS[p].alias;
const qr = qrcode(0, 'M');
qr.addData('https://festivalazo.github.io/pagos/?p=' + p);
qr.make();
document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 10, margin: 0, scalable: true });
</script>
</body>
</html>
